<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="Experiência de Realidade Aumentada — aponte a câmera para a imagem alvo e veja o conteúdo ganhar vida." />
    <title>WebAR — Realidade Aumentada</title>

    <!--
      ORDEM DE IMPORTAÇÃO OBRIGATÓRIA:
      1. A-Frame primeiro
      2. MindAR depois (registra componentes no A-Frame já carregado)
    -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      /* ─── Reset mínimo ────────────────────────────────
         NÃO sobrescrever video, canvas ou elementos do MindAR.
         O MindAR injeta um <video> de câmera com estilos inline
         — qualquer override nosso pode torná-lo invisível.
      ─────────────────────────────────────────────── */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        height: 100%;
        background: #000;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }

      /* ─── Força GPU layer no vídeo de câmera do MindAR ──
         O MindAR injeta o vídeo sem transform — em alguns
         Androids o frame de câmera não atualiza sem GPU layer.
      ─────────────────────────────────────────────── */
      video {
        -webkit-transform: translateZ(0);
        transform: translateZ(0);
      }

      /* ─── TELA DE INÍCIO ──────────────────────────────
         Exibida antes do AR iniciar.
         Garante interação do usuário antes de pedir câmera.
      ─────────────────────────────────────────────── */
      #start-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 40px 32px;
        background: radial-gradient(
          ellipse at 60% 30%,
          rgba(124, 58, 237, 0.22) 0%,
          rgba(10, 10, 15, 0.98) 70%
        );
        text-align: center;
      }

      .logo-ring {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: linear-gradient(135deg, #7c3aed, #db2777);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.8rem;
        box-shadow: 0 0 0 8px rgba(124,58,237,0.15), 0 0 0 16px rgba(124,58,237,0.07);
        animation: ring-pulse 3s ease-in-out infinite;
      }

      @keyframes ring-pulse {
        0%,100% { box-shadow: 0 0 0 8px rgba(124,58,237,0.15), 0 0 0 16px rgba(124,58,237,0.07); }
        50%      { box-shadow: 0 0 0 14px rgba(219,39,119,0.20), 0 0 0 26px rgba(219,39,119,0.06); }
      }

      #start-screen h1 {
        font-size: 1.55rem;
        font-weight: 800;
        color: #fff;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      #start-screen p {
        font-size: 0.95rem;
        color: rgba(255,255,255,0.60);
        line-height: 1.6;
        max-width: 280px;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }

      #btn-start-ar {
        padding: 18px 52px;
        border: none;
        border-radius: 50px;
        background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
        color: #fff;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 8px 30px rgba(124,58,237,0.55);
        transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), opacity 0.2s;
      }

      #btn-start-ar:active { transform: scale(0.95); }
      #btn-start-ar:hover  { transform: scale(1.05); }
      #btn-start-ar:disabled { opacity: 0.5; pointer-events: none; }

      #loading-msg {
        font-size: 0.85rem;
        color: rgba(255,255,255,0.50);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        display: none;
        animation: fade-blink 1.4s ease-in-out infinite;
      }

      #loading-msg.visible { display: block; }

      @keyframes fade-blink {
        0%,100% { opacity: 0.4; }
        50%     { opacity: 1; }
      }

      /* ─── UI AR ───────────────────────────────────────── */
      #ui-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: 48px;
      }

      #btn-play {
        display: none;
        pointer-events: all;
        cursor: pointer;
        padding: 16px 44px;
        border: none;
        border-radius: 50px;
        background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
        color: #fff;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        box-shadow: 0 8px 32px rgba(124,58,237,0.55), 0 2px 8px rgba(0,0,0,0.35);
        transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1);
        animation: pulse-glow 2.4s ease-in-out infinite;
      }

      #btn-play::before { content: "▶  "; font-size: 0.95em; }
      #btn-play:hover   { transform: scale(1.07); }
      #btn-play:active  { transform: scale(0.96); }

      @keyframes pulse-glow {
        0%,100% { box-shadow: 0 8px 32px rgba(124,58,237,0.55), 0 2px 8px rgba(0,0,0,0.35); }
        50%     { box-shadow: 0 12px 44px rgba(219,39,119,0.75), 0 4px 14px rgba(0,0,0,0.40); }
      }

      #hint {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 9998;
        padding: 14px 24px;
        text-align: center;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 0.9rem;
        font-weight: 500;
        color: rgba(255,255,255,0.92);
        letter-spacing: 0.02em;
        background: linear-gradient(to bottom, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0) 100%);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        transition: opacity 0.5s ease;
        display: none;
      }

      #hint.hidden { opacity: 0; pointer-events: none; }

      /* ─── Tela de erro ────────────────────────────────── */
      #error-msg {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: rgba(10,10,15,0.97);
        color: #fff;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 1rem;
        text-align: center;
        padding: 40px 32px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        line-height: 1.6;
        display: none;
      }

      #error-msg.visible { display: flex; }
      #error-msg .icon   { font-size: 2.5rem; }
      #error-msg strong  { font-size: 1.2rem; }

      #btn-retry {
        margin-top: 12px;
        padding: 12px 32px;
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 50px;
        background: transparent;
        color: #fff;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 0.95rem;
        cursor: pointer;
      }
    </style>
  </head>

  <body>

    <!-- TELA DE INÍCIO ────────────────────────────────── -->
    <div id="start-screen">
      <div class="logo-ring">📦</div>
      <h1>Realidade Aumentada</h1>
      <p>Aponte a câmera para a imagem do produto e veja a experiência ganhar vida.</p>
      <button id="btn-start-ar">🎬 Iniciar AR</button>
      <span id="loading-msg">Abrindo câmera…</span>
    </div>

    <!-- TELA DE ERRO ──────────────────────────────────── -->
    <div id="error-msg">
      <span class="icon">⚠️</span>
      <strong>Não foi possível acessar a câmera</strong>
      <p id="error-detail">Verifique as permissões do navegador e certifique-se de estar usando HTTPS.</p>
      <button id="btn-retry" onclick="location.reload()">↺ Tentar novamente</button>
    </div>

    <!-- UI AR ─────────────────────────────────────────── -->
    <div id="hint">📷 Aponte a câmera para a imagem alvo</div>

    <div id="ui-overlay">
      <button id="btn-play" aria-label="Tocar vídeo de realidade aumentada">
        Tocar Vídeo
      </button>
    </div>

    <!--
      CENA AR ─────────────────────────────────────────────
      • autoStart: false  → câmera só abre após interação
      • color-space + renderer com alpha:true → canvas WebGL
        transparente + pipeline oficial do MindAR
      • alpha: true → OBRIGATÓRIO para o feed da câmera
        aparecer por trás do canvas WebGL
    ─────────────────────────────────────────────────── -->
    <a-scene
      id="ar-scene"
      mindar-image="imageTargetSrc: ./assets/alvo.mind; autoStart: false; uiScanning: yes;"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >

      <a-assets>
        <!--
          CORREÇÕES DO VÍDEO:
          ① crossorigin REMOVIDO — bloqueava a textura WebGL quando
            o servidor não envia headers CORS (causa retângulo preto)
          ② muted MANTIDO — necessário para contornar bloqueio de
            autoplay em mobile (mudo é removido no clique do usuário)
          ③ playsinline + webkit-playsinline — obrigatório para iOS
        -->
        <video
          id="ar-video"
          src="./assets/video.mp4"
          playsinline
          webkit-playsinline
          muted
          preload="auto"
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target-entity" mindar-image-target="targetIndex: 0">
        <!--
          <a-plane> com material é mais compatível com mobile
          do que <a-video> para atualização de textura WebGL
        -->
        <a-plane
          id="ar-video-plane"
          material="src: #ar-video; shader: flat; side: double"
          position="0 0 0"
          rotation="0 0 0"
          width="1"
          height="0.5625"
        ></a-plane>
      </a-entity>

    </a-scene>

    <script>
      'use strict';

      /* ── Referências ─────────────────────────────────── */
      const startScreen = document.getElementById('start-screen');
      const btnStartAR  = document.getElementById('btn-start-ar');
      const loadingMsg  = document.getElementById('loading-msg');
      const errorMsg    = document.getElementById('error-msg');
      const errorDetail = document.getElementById('error-detail');
      const hintEl      = document.getElementById('hint');
      const btnPlay     = document.getElementById('btn-play');
      const arVideo     = document.getElementById('ar-video');
      const sceneEl     = document.getElementById('ar-scene');
      const targetEl    = document.getElementById('target-entity');

      /* ── Botão INICIAR AR ──────────────────────────────
         Garante a interação do usuário ANTES de pedir câmera.
         Resolve bloqueio de câmera em navegadores mobile.
      ─────────────────────────────────────────────────── */
      btnStartAR.addEventListener('click', () => {
        btnStartAR.disabled = true;
        loadingMsg.classList.add('visible');

        const tentarIniciar = () => {
          const arSystem = sceneEl.systems['mindar-image-system'];
          if (!arSystem) {
            setTimeout(tentarIniciar, 200);
            return;
          }
          arSystem.start();
        };

        if (sceneEl.hasLoaded) {
          tentarIniciar();
        } else {
          sceneEl.addEventListener('loaded', tentarIniciar, { once: true });
        }
      });

      /* ── arReady: câmera iniciou com sucesso ──────────── */
      sceneEl.addEventListener('arReady', () => {
        console.log('[MindAR] Câmera ativa.');

        // Esconde tela de início
        startScreen.style.display = 'none';
        hintEl.style.display = 'block';

        /*
          CORREÇÃO DE CÂMERA PRETA:
          O MindAR injeta um <video> no DOM para o feed da câmera.
          Em alguns Android Chrome, esse vídeo não atualiza os frames
          sem um reflow/repaint forçado. Aplicamos estilos explícitos
          e forçamos GPU layer via translateZ(0).
        */
        setTimeout(() => {
          document.querySelectorAll('video').forEach(v => {
            if (v.id !== 'ar-video') {
              // É o vídeo de câmera do MindAR
              v.style.display    = 'block';
              v.style.visibility = 'visible';
              v.style.opacity    = '1';
              v.style.webkitTransform = 'translateZ(0)';
              v.style.transform  = 'translateZ(0)';
              // Força repaint
              v.style.willChange = 'transform';
              // Garante que está tocando
              if (v.paused) v.play().catch(() => {});
            }
          });
        }, 300);
      });

      /* ── arError: câmera falhou ─────────────────────── */
      sceneEl.addEventListener('arError', (e) => {
        console.error('[MindAR] Erro:', e);
        startScreen.style.display = 'none';
        errorDetail.textContent =
          (e.detail?.message) ||
          'Permissão negada ou câmera em uso por outro aplicativo.';
        errorMsg.classList.add('visible');
      });

      /* ── targetFound ─────────────────────────────────── */
      targetEl.addEventListener('targetFound', () => {
        console.log('[MindAR] Alvo encontrado.');
        hintEl.classList.add('hidden');
        btnPlay.style.display = 'block';
      });

      /* ── targetLost ──────────────────────────────────── */
      targetEl.addEventListener('targetLost', () => {
        console.log('[MindAR] Alvo perdido.');
        if (!arVideo.paused) arVideo.pause();
        btnPlay.style.display = 'none';
        hintEl.classList.remove('hidden');
      });

      /* ── Clique em TOCAR VÍDEO ──────────────────────── */
      btnPlay.addEventListener('click', () => {
        // Remove o mudo ANTES do play (restaura áudio após gesto do usuário)
        arVideo.muted = false;

        arVideo.play()
          .then(() => {
            console.log('[AR] Vídeo iniciado.');
            /*
              Força atualização da textura WebGL após play().
              Em alguns mobile o Three.js não detecta automaticamente
              que o vídeo começou a tocar.
            */
            const planeEl = document.getElementById('ar-video-plane');
            if (planeEl && planeEl.components && planeEl.components.material) {
              const mat = planeEl.components.material.material;
              if (mat && mat.map) mat.map.needsUpdate = true;
            }
          })
          .catch(err => console.warn('[AR] Erro ao reproduzir:', err));

        btnPlay.style.display = 'none';
      });
    </script>

  </body>
</html>
