<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="Experiência de Realidade Aumentada — aponte a câmera para a imagem alvo e veja o conteúdo ganhar vida." />
    <title>WebAR — Realidade Aumentada</title>

    <!-- ═══════════════════════════════════════════════════
         CDN — A-Frame 1.4.2 (estável mobile) + MindAR 1.2.5
    ════════════════════════════════════════════════════ -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      /* ═══════════════════════════════════
         Reset base — fonte sans-serif obrigatória
         IMPORTANTE: NÃO sobrescrever posicionamento do
         <a-scene> nem do <video> interno do MindAR.
         O MindAR injeta um <video> para o feed da câmera
         e posiciona ele internamente — qualquer override
         de CSS nesse elemento causa tela preta.
      ═══════════════════════════════════ */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        height: 100%;
        /* overflow hidden APENAS no body, não interfere com
           o canvas/video do MindAR que ficam no documento */
        background: #000;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }

      /* ═══════════════════════════════════
         ⚠️  NÃO aplicar position/inset/width/height
         no seletor a-scene — isso quebra o feed de câmera
         do MindAR em dispositivos móveis.
      ═══════════════════════════════════ */

      /* ═══════════════════════════════════
         Camada de UI sobreposta — z-index alto,
         pointer-events desativado para não bloquear toque na cena
      ═══════════════════════════════════ */
      #ui-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: 48px;
      }

      /* ═══════════════════════════════════
         Botão "Tocar Vídeo" — inicialmente oculto
      ═══════════════════════════════════ */
      #btn-play {
        display: none;
        pointer-events: all;
        cursor: pointer;

        padding: 16px 44px;
        border: none;
        border-radius: 50px;

        background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
        color: #fff;

        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;

        box-shadow:
          0 8px 32px rgba(124, 58, 237, 0.55),
          0 2px 8px rgba(0, 0, 0, 0.35);

        transition:
          transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.18s ease,
          opacity 0.25s ease;

        animation: pulse-glow 2.4s ease-in-out infinite;
      }

      #btn-play:hover {
        transform: scale(1.07);
        box-shadow:
          0 14px 40px rgba(124, 58, 237, 0.70),
          0 4px 12px rgba(0, 0, 0, 0.40);
      }

      #btn-play:active {
        transform: scale(0.96);
      }

      #btn-play::before {
        content: "▶  ";
        font-size: 0.95em;
      }

      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 8px 32px rgba(124, 58, 237, 0.55), 0 2px 8px rgba(0,0,0,0.35); }
        50%       { box-shadow: 0 12px 44px rgba(219, 39, 119, 0.75), 0 4px 14px rgba(0,0,0,0.40); }
      }

      /* ═══════════════════════════════════
         Dica de instrução no topo
      ═══════════════════════════════════ */
      #hint {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 9998;
        padding: 14px 24px;
        text-align: center;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 0.9rem;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.92);
        letter-spacing: 0.02em;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.72) 0%,
          rgba(0, 0, 0, 0) 100%
        );
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        transition: opacity 0.5s ease;
      }

      #hint.hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>

  <body>

    <!-- ═══════════════════════════════════════════════════
         UI Overlay — fora da cena A-Frame
    ════════════════════════════════════════════════════ -->
    <div id="hint">📷 Aponte a câmera para a imagem alvo</div>

    <div id="ui-overlay">
      <button id="btn-play" aria-label="Tocar vídeo de realidade aumentada">
        Tocar Vídeo
      </button>
    </div>

    <!-- ═══════════════════════════════════════════════════
         CENA AR — MindAR + A-Frame

         CORREÇÕES DE TELA PRETA MOBILE:
         ① REMOVIDO color-space="sRGB" — causava conflito de
           contexto WebGL em Android/Chrome mobile
         ② REMOVIDO renderer="colorManagement..." — o pipeline
           físico interfere com o shader interno do MindAR
         ③ NÃO há CSS sobrescrevendo position/size do a-scene
           (o MindAR gerencia isso internamente)
    ════════════════════════════════════════════════════ -->
    <a-scene
      mindar-image="imageTargetSrc: ./assets/alvo.mind; autoStart: true; uiScanning: yes;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >

      <!-- ─── Assets ─────────────────────────────────────
           • muted: obrigatório para contornar bloqueio de
             autoplay do navegador mobile (evita congelamento)
           • playsinline + webkit-playsinline: obrigatório iOS
      ──────────────────────────────────────────────── -->
      <a-assets>
        <video
          id="ar-video"
          src="./assets/video.mp4"
          playsinline
          webkit-playsinline
          muted
          preload="auto"
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <!-- ─── Câmera ──────────────────────────────────── -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- ─── Entidade Alvo (targetIndex: 0) ───────────
           Ajuste width/height conforme a proporção do vídeo:
           16:9 → height="0.5625" | 4:3 → height="0.75" | 1:1 → height="1"
      ──────────────────────────────────────────────── -->
      <a-entity id="target-entity" mindar-image-target="targetIndex: 0">
        <a-video
          id="ar-video-plane"
          src="#ar-video"
          position="0 0 0"
          rotation="0 0 0"
          width="1"
          height="0.5625"
        ></a-video>
      </a-entity>

    </a-scene>

    <!-- ═══════════════════════════════════════════════════
         LÓGICA JAVASCRIPT
    ════════════════════════════════════════════════════ -->
    <script>
      'use strict';

      const btnPlay  = document.getElementById('btn-play');
      const arVideo  = document.getElementById('ar-video');
      const targetEl = document.getElementById('target-entity');
      const hintEl   = document.getElementById('hint');

      // ── targetFound: imagem alvo detectada ────────────
      targetEl.addEventListener('targetFound', () => {
        console.log('[MindAR] Alvo encontrado.');
        hintEl.classList.add('hidden');
        btnPlay.style.display = 'block';
      });

      // ── targetLost: imagem alvo perdida ───────────────
      targetEl.addEventListener('targetLost', () => {
        console.log('[MindAR] Alvo perdido.');
        if (!arVideo.paused) arVideo.pause();
        btnPlay.style.display = 'none';
        hintEl.classList.remove('hidden');
      });

      // ── Clique no botão: desativar mudo → play → sumir ─
      btnPlay.addEventListener('click', () => {
        // Desativa o mudo ANTES do play para restaurar o áudio
        // após a interação do usuário (contorna política de autoplay)
        arVideo.muted = false;

        arVideo.play()
          .then(() => {
            console.log('[AR] Vídeo iniciado com sucesso.');
          })
          .catch((err) => {
            console.warn('[AR] Erro ao iniciar vídeo:', err);
          });

        btnPlay.style.display = 'none';
      });
    </script>

  </body>
</html>
