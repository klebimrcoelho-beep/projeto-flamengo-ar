<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="Realidade Aumentada — aponte a câmera para a imagem do produto." />
    <title>WebAR — Realidade Aumentada</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      /* ═══════════════════════════════════════════════
         BASE — fonte sans-serif obrigatória, fundo neutro
      ═══════════════════════════════════════════════ */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        height: 100%;
        /* TRANSPARENTE — qualquer cor aqui aparece
           por trás do canvas e pode mascarar a câmera */
        background: transparent;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }

      /*
        CANVAS TRANSPARENTE — obrigatório para o vídeo
        da câmera injetado pelo MindAR aparecer por trás.
        Sem isso, o canvas fica preto opaco.
      */
      canvas {
        background-color: transparent !important;
      }

      /* ═══════════════════════════════════════════════
         TELA DE INÍCIO
      ═══════════════════════════════════════════════ */
      #start-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 40px 32px;
        background: radial-gradient(
          ellipse at 60% 30%,
          rgba(124, 58, 237, 0.25) 0%,
          rgba(8, 8, 14, 0.97) 70%
        );
        text-align: center;
      }

      .logo-ring {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: linear-gradient(135deg, #7c3aed, #db2777);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.8rem;
        box-shadow:
          0 0 0 8px rgba(124, 58, 237, 0.15),
          0 0 0 16px rgba(124, 58, 237, 0.07);
        animation: ring-pulse 3s ease-in-out infinite;
      }

      @keyframes ring-pulse {
        0%, 100% {
          box-shadow: 0 0 0 8px rgba(124,58,237,0.15), 0 0 0 16px rgba(124,58,237,0.07);
        }
        50% {
          box-shadow: 0 0 0 14px rgba(219,39,119,0.20), 0 0 0 26px rgba(219,39,119,0.07);
        }
      }

      #start-screen h1 {
        font-size: 1.55rem;
        font-weight: 800;
        color: #fff;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      #start-screen p {
        font-size: 0.95rem;
        color: rgba(255, 255, 255, 0.58);
        line-height: 1.65;
        max-width: 280px;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }

      #btn-start-ar {
        padding: 18px 52px;
        border: none;
        border-radius: 50px;
        background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
        color: #fff;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 8px 30px rgba(124, 58, 237, 0.55);
        transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
        -webkit-tap-highlight-color: transparent;
      }

      #btn-start-ar:active   { transform: scale(0.95); }
      #btn-start-ar:hover    { transform: scale(1.05); }
      #btn-start-ar:disabled { opacity: 0.55; pointer-events: none; }

      #loading-msg {
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.48);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        display: none;
        animation: fade-blink 1.4s ease-in-out infinite;
      }

      #loading-msg.show { display: block; }

      @keyframes fade-blink {
        0%, 100% { opacity: 0.35; }
        50%       { opacity: 1; }
      }

      /* ═══════════════════════════════════════════════
         UI AR — visível após câmera iniciar
      ═══════════════════════════════════════════════ */
      #ui-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: 48px;
      }

      #btn-play {
        display: none;
        pointer-events: all;
        cursor: pointer;
        padding: 16px 44px;
        border: none;
        border-radius: 50px;
        background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
        color: #fff;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        box-shadow: 0 8px 32px rgba(124, 58, 237, 0.55), 0 2px 8px rgba(0,0,0,0.35);
        transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
        animation: pulse-glow 2.4s ease-in-out infinite;
        -webkit-tap-highlight-color: transparent;
      }

      #btn-play::before { content: "▶  "; font-size: 0.95em; }
      #btn-play:hover   { transform: scale(1.07); }
      #btn-play:active  { transform: scale(0.96); }

      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 8px 32px rgba(124,58,237,0.55), 0 2px 8px rgba(0,0,0,0.35); }
        50%       { box-shadow: 0 12px 44px rgba(219,39,119,0.75), 0 4px 14px rgba(0,0,0,0.40); }
      }

      #hint {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 9998;
        padding: 14px 24px;
        text-align: center;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 0.9rem;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.92);
        letter-spacing: 0.02em;
        background: linear-gradient(to bottom, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0) 100%);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        transition: opacity 0.5s ease;
        display: none;
      }

      #hint.hidden { opacity: 0; pointer-events: none; }

      /* ═══════════════════════════════════════════════
         TELA DE ERRO
      ═══════════════════════════════════════════════ */
      #error-screen {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: rgba(8, 8, 14, 0.97);
        color: #fff;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 40px 32px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        line-height: 1.6;
        display: none;
      }

      #error-screen.show  { display: flex; }
      #error-screen .icon { font-size: 2.5rem; }
      #error-screen strong { font-size: 1.15rem; }

      #btn-retry {
        margin-top: 8px;
        padding: 12px 32px;
        border: 1px solid rgba(255,255,255,0.22);
        border-radius: 50px;
        background: transparent;
        color: #fff;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 0.95rem;
        cursor: pointer;
      }
    </style>
  </head>

  <body>

    <!-- TELA DE INÍCIO -->
    <div id="start-screen">
      <div class="logo-ring">📦</div>
      <h1>Realidade Aumentada</h1>
      <p>Aponte a câmera para a imagem do produto e veja a experiência ganhar vida.</p>
      <button id="btn-start-ar">🎬 Iniciar AR</button>
      <span id="loading-msg">Abrindo câmera…</span>
    </div>

    <!-- TELA DE ERRO -->
    <div id="error-screen">
      <span class="icon">⚠️</span>
      <strong>Câmera indisponível</strong>
      <p id="error-detail">Verifique as permissões e certifique-se de usar HTTPS.</p>
      <button id="btn-retry" onclick="location.reload()">↺ Tentar novamente</button>
    </div>

    <!-- UI AR -->
    <div id="hint">📷 Aponte a câmera para a imagem alvo</div>
    <div id="ui-overlay">
      <button id="btn-play" aria-label="Tocar vídeo">Tocar Vídeo</button>
    </div>

    <!--
    ═══════════════════════════════════════════════════════
      CENA AR

      CORREÇÕES APLICADAS (baseadas em issues oficiais MindAR):

      ① embedded — OBRIGATÓRIO para o MindAR posicionar
        corretamente o canvas e o vídeo de câmera em mobile.
        Sem ele, o canvas fica desalinhado e a câmera não aparece.

      ② uiLoading:no; uiError:no; uiScanning:no — os overlays
        padrão do MindAR interferem no loop de renderização
        e causam tela preta em alguns dispositivos Android.
        Usamos nossa própria UI no lugar.

      ③ renderer="alpha:true" — torna o canvas WebGL transparente
        para o vídeo de câmera aparecer por trás.

      ④ autoStart: false + botão manual — garante que o
        getUserMedia só é chamado após gesto do usuário,
        evitando bloqueio de câmera em mobile.
    ═══════════════════════════════════════════════════════
    -->
    <a-scene
      id="ar-scene"
      mindar-image="imageTargetSrc: ./assets/alvo.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no;"
      embedded
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >

      <a-assets>
        <!--
          VÍDEO DO CONTEÚDO AR:
          • muted: contorna bloqueio de autoplay no mobile
          • playsinline + webkit-playsinline: exibição inline (iOS)
          • SEM crossorigin: evita bloqueio de textura WebGL por CORS
          • preload="auto": pré-carrega para reduzir delay na reprodução
        -->
        <video
          id="ar-video"
          src="./assets/video.mp4"
          playsinline
          webkit-playsinline
          muted
          preload="auto"
          loop
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target-entity" mindar-image-target="targetIndex: 0">
        <!--
          Proporção 16:9 → height="0.5625"
          Ajuste se seu vídeo for 4:3 → height="0.75"
                              ou 1:1 → height="1"
        -->
        <a-video
          id="ar-video-el"
          src="#ar-video"
          position="0 0 0"
          rotation="0 0 0"
          width="1"
          height="0.5625"
        ></a-video>
      </a-entity>

    </a-scene>

    <script>
      'use strict';

      /* ── Referências DOM ──────────────────────────────── */
      const startScreen = document.getElementById('start-screen');
      const btnStartAR  = document.getElementById('btn-start-ar');
      const loadingMsg  = document.getElementById('loading-msg');
      const errorScreen = document.getElementById('error-screen');
      const errorDetail = document.getElementById('error-detail');
      const hintEl      = document.getElementById('hint');
      const btnPlay     = document.getElementById('btn-play');
      const arVideo     = document.getElementById('ar-video');
      const sceneEl     = document.getElementById('ar-scene');
      const targetEl    = document.getElementById('target-entity');

      /* ── Iniciar AR ao clicar ─────────────────────────── */
      btnStartAR.addEventListener('click', () => {
        btnStartAR.disabled = true;
        loadingMsg.classList.add('show');

        const iniciar = () => {
          const sys = sceneEl.systems['mindar-image-system'];
          if (!sys) { setTimeout(iniciar, 150); return; }
          sys.start();
        };

        sceneEl.hasLoaded ? iniciar() : sceneEl.addEventListener('loaded', iniciar, { once: true });
      });

      /* ── Câmera ativa com sucesso ─────────────────────── */
      sceneEl.addEventListener('arReady', () => {
        startScreen.style.display = 'none';
        hintEl.style.display      = 'block';

        /*
          Garante que o vídeo de câmera injetado pelo MindAR
          está visível e com GPU layer ativo.
          O MindAR posiciona o vídeo com estilos inline, mas em
          alguns Android Chrome os frames não atualizam sem
          translateZ(0) forçado.
        */
        document.querySelectorAll('video').forEach(v => {
          if (v.id !== 'ar-video') {
            v.setAttribute('playsinline', '');
            v.setAttribute('webkit-playsinline', '');
            v.style.display         = 'block';
            v.style.visibility      = 'visible';
            v.style.opacity         = '1';
            v.style.webkitTransform = 'translateZ(0)';
            v.style.transform       = 'translateZ(0)';
            v.style.willChange      = 'transform';
            if (v.paused) v.play().catch(() => {});
          }
        });

        /*
          Força o renderer WebGL a usar fundo transparente.
          Garante que mesmo que o atributo renderer="alpha:true"
          seja processado depois da criação do contexto,
          o clear color seja transparente.
        */
        const renderer = sceneEl.renderer;
        if (renderer) {
          renderer.setClearColor(0x000000, 0);
        }
      });

      /* ── Erro de câmera ───────────────────────────────── */
      sceneEl.addEventListener('arError', (e) => {
        startScreen.style.display = 'none';
        errorDetail.textContent =
          (e.detail?.message) || 'Permissão negada ou câmera em uso por outro app.';
        errorScreen.classList.add('show');
      });

      /* ── Alvo encontrado ──────────────────────────────── */
      targetEl.addEventListener('targetFound', () => {
        hintEl.classList.add('hidden');
        btnPlay.style.display = 'block';
      });

      /* ── Alvo perdido ─────────────────────────────────── */
      targetEl.addEventListener('targetLost', () => {
        if (!arVideo.paused) arVideo.pause();
        btnPlay.style.display = 'none';
        hintEl.classList.remove('hidden');
      });

      /* ── Tocar vídeo ──────────────────────────────────── */
      btnPlay.addEventListener('click', () => {
        btnPlay.style.display = 'none';

        /*
          ORDEM CORRETA PARA MOBILE:
          1. load()  — força carregamento (mobile ignora preload=auto)
          2. play()  — toca ainda MUDO (gesto do usuário garante sucesso)
          3. .then() — dentro do then, desmuta (gesto ainda válido)
          Inverter a ordem (muted=false antes de play) invalida
          o token de gesto e faz o play() falhar silenciosamente.
        */
        arVideo.load(); // garante que o vídeo foi carregado

        const doPlay = () => {
          arVideo.play()
            .then(() => {
              // Desmuta DEPOIS do play bem-sucedido
              arVideo.muted = false;

              // Força atualização da textura WebGL no Three.js
              // VideoTexture precisa de needsUpdate=true após play() em mobile
              const aVideoEl = document.getElementById('ar-video-el');
              if (aVideoEl?.components?.material?.material?.map) {
                aVideoEl.components.material.material.map.needsUpdate = true;
              }

              console.log('[AR] Vídeo iniciado com sucesso.');
            })
            .catch(err => {
              console.warn('[AR] Falha no play, tentando mudo:', err);
              // Fallback: toca mudo se não conseguir com áudio
              arVideo.muted = true;
              arVideo.play().catch(e => console.error('[AR] Falha total:', e));
            });
        };

        // Se vídeo já tem dados, toca direto; caso contrário espera carregar
        if (arVideo.readyState >= 2) {
          doPlay();
        } else {
          arVideo.addEventListener('canplay', doPlay, { once: true });
        }
      });
    </script>

  </body>
</html>
